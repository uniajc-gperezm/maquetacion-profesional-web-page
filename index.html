<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disney | Proyecto educativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="navbar__left">
      <a href="#" class="navbar__logo">
        <img src="images/logo.png" alt="Disney">
      </a>
      <ul class="navbar__links">
        <li><a href="#disney-plus">Disney+</a></li>
        <li><a href="#parks-and-travel">Parks &amp; Travel</a></li>
        <li><a href="#movies">Movies</a></li>
        <li><a href="#shop">Shop</a></li>
        <li><a href="#more">More</a></li>
      </ul>
    </div>
    <div class="navbar__right">
      <a href="#" class="navbar__login">Log in</a>
      <form class="navbar__search" role="search">
        <input type="search" placeholder="Search" aria-label="Buscar">
        <button type="submit" aria-label="Buscar">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </div>
  </nav>

    <section class="banner">
    <div class="banner__content">
      <img src="images/snow-white.png" alt="Disney Snow White" class="banner__title">
      <p class="banner__text">Experience <em>Snow White</em>, now playing only in theaters!</p>
      <a href="#" class="btn btn--primary">Get Tickets Now</a>
      <a href="#" class="btn btn--outline">Learn More</a>
    </div>
    </section>
    

    

  <footer>

  </footer>

</body>
</html>
